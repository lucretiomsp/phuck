name: build libphuck

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      chuck_ref:
        description: "ChucK git ref (branch, tag or commit)"
        default: "main"

env:
  CHUCK_REF: ${{ github.event.inputs.chuck_ref || 'main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ubuntu:20.04   # glibc 2.31: loads on 20.04 and every newer distro
            name: linux-x64
            lib: build/libphuck.so
            test: build/test_sine
          - os: macos-14
            name: macos-universal     # one dylib for Apple Silicon + Intel
            lib: build/libphuck.dylib
            test: build/test_sine
            cmake_extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
          - os: windows-2022
            name: windows-x64
            lib: build/Release/phuck.dll
            test: build/Release/test_sine.exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}

    steps:
      - name: Linux deps (container)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y build-essential git libasound2-dev python3-pip binutils
          pip3 install cmake

      - uses: actions/checkout@v4

      - name: Get ChucK source
        uses: actions/checkout@v4
        with:
          repository: ccrma/chuck
          ref: ${{ env.CHUCK_REF }}
          path: chuck

      - name: Configure
        run: cmake -B build -DCHUCK_SRC="${{ github.workspace }}/chuck/src" -DCMAKE_BUILD_TYPE=Release -DPHUCK_TESTS=ON ${{ matrix.cmake_extra }}
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: bash

      - name: Check glibc requirement
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T ${{ matrix.lib }} | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "libphuck.so needs $need"
          [ "$(printf '%s\nGLIBC_2.31\n' "$need" | sort -V | tail -1)" = "GLIBC_2.31" ] \
            || { echo "::error::needs $need, newer than GLIBC_2.31"; exit 1; }
        shell: bash

      - name: Offline test (SinOsc freq control)
        run: ${{ matrix.test }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: libphuck-${{ matrix.name }}
          path: |
            ${{ matrix.lib }}
            phuck.h

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip per platform
        run: cd dist && for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
